<!DOCTYPE html>
<html>
<head><title>Signing in…</title></head>
<body>
<p style="font-family:sans-serif;padding:20px;color:#555">Signing in, please wait…</p>
<script>
  const hash = window.location.hash.substring(1);
  const params = {};
  hash.split('&').forEach(p => {
    const [k, v] = p.split('=');
    if (k) params[decodeURIComponent(k)] = decodeURIComponent(v || '');
  });
  // Also check query string — prompt=none errors come back as query params
  const query = window.location.search.substring(1);
  query.split('&').forEach(p => {
    const [k, v] = p.split('=');
    if (k && !params[k]) params[decodeURIComponent(k)] = decodeURIComponent(v || '');
  });
  const target = window.opener || (window.parent !== window ? window.parent : null);
  if (target) {
    target.postMessage(params, 'https://zacharypals.github.io');
    if (window.opener) window.close();
  } else {
    document.body.innerHTML = '<p style="font-family:sans-serif;padding:20px;color:#c00">Sign-in failed. Please close this window and try again.</p>';
  }
</script>
</body>
</html>
