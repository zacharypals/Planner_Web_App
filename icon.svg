<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b1f5e"/>
      <stop offset="100%" style="stop-color:#5c2d8a"/>
    </linearGradient>
    <linearGradient id="brass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c96d"/>
      <stop offset="40%" style="stop-color:#c9a84c"/>
      <stop offset="100%" style="stop-color:#a07828"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1a0a30" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bg)"/>
  <rect width="512" height="512" rx="100" ry="100" fill="url(#shine)"/>

  <!-- Outer brass border -->
  <rect x="28" y="28" width="456" height="456" rx="76" ry="76"
    fill="none" stroke="url(#brass)" stroke-width="4" opacity="0.7"/>
  <!-- Inner brass border -->
  <rect x="42" y="42" width="428" height="428" rx="64" ry="64"
    fill="none" stroke="url(#brass)" stroke-width="1.5" opacity="0.35"/>

  <!-- Corner ornaments - top left -->
  <g fill="url(#brass)" opacity="0.8">
    <rect x="54" y="54" width="24" height="3" rx="1.5"/>
    <rect x="54" y="54" width="3" height="24" rx="1.5"/>
  </g>
  <!-- Corner ornaments - top right -->
  <g fill="url(#brass)" opacity="0.8">
    <rect x="434" y="54" width="24" height="3" rx="1.5"/>
    <rect x="455" y="54" width="3" height="24" rx="1.5"/>
  </g>
  <!-- Corner ornaments - bottom left -->
  <g fill="url(#brass)" opacity="0.8">
    <rect x="54" y="455" width="24" height="3" rx="1.5"/>
    <rect x="54" y="434" width="3" height="24" rx="1.5"/>
  </g>
  <!-- Corner ornaments - bottom right -->
  <g fill="url(#brass)" opacity="0.8">
    <rect x="434" y="455" width="24" height="3" rx="1.5"/>
    <rect x="455" y="434" width="3" height="24" rx="1.5"/>
  </g>

  <!-- Diamond accents -->
  <polygon points="256,72 263,82 256,92 249,82" fill="url(#brass)" opacity="0.7"/>
  <polygon points="256,420 263,430 256,440 249,430" fill="url(#brass)" opacity="0.7"/>

  <!-- LP letterforms -->
  <g filter="url(#shadow)" fill="url(#brass)">

    <!-- L stem -->
    <rect x="96" y="145" width="38" height="222" rx="4"/>
    <!-- L top serif -->
    <rect x="78" y="145" width="56" height="11" rx="5.5"/>
    <!-- L bottom bar -->
    <rect x="96" y="333" width="120" height="34" rx="8"/>
    <!-- L bottom right serif -->
    <rect x="188" y="333" width="12" height="34" rx="6"/>
    <!-- L bottom serif left (foot) -->
    <rect x="78" y="356" width="56" height="11" rx="5.5"/>

    <!-- Center divider dot -->
    <circle cx="256" cy="256" r="9" opacity="0.55"/>

    <!-- P stem -->
    <rect x="278" y="145" width="38" height="222" rx="4"/>
    <!-- P top serif -->
    <rect x="260" y="145" width="56" height="11" rx="5.5"/>
    <!-- P bottom serif -->
    <rect x="260" y="356" width="56" height="11" rx="5.5"/>
    <!-- P bowl top bar -->
    <rect x="278" y="145" width="110" height="34" rx="8"/>
    <!-- P bowl bottom bar -->
    <rect x="278" y="241" width="110" height="30" rx="8"/>
    <!-- P bowl right curve -->
    <rect x="374" y="145" width="34" height="126" rx="17"/>

  </g>
</svg>